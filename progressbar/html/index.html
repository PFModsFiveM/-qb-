<html>
    <head>
        <meta charset="utf-8" />
        <!-- the shared PF look: pfm-ui's fonts and tokens (style.css has fallbacks if pfm-ui is stopped) -->
        <link rel="stylesheet" href="https://cfx-nui-pfm-ui/html/fonts.css" />
        <link rel="stylesheet" href="https://cfx-nui-pfm-ui/html/tokens.css" />
        <link href="./style.css" rel="stylesheet" type="text/css" />
        <script src="https://cfx-nui-pfm-ui/html/theme.js"></script>
    </head>
    <body>
        <!-- The progress capsule: a stat disc that fills white from the bottom (the percentage in it), the
             label as the title beside it, and a track under the label. script.js sets --pb-p (0-1). -->
        <div class="progress-container">
            <div class="pb-cap">
                <div class="pb-disc">
                    <div class="pb-disc-clip">
                        <div class="pb-disc-core"></div>
                        <div class="pb-disc-fill"></div>
                    </div>
                    <div class="pb-disc-ring"></div>
                    <div id="progress-percentage">0%</div>
                </div>
                <div class="pb-body">
                    <div class="progress-labels">
                        <div id="progress-label">Loading...</div>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./script.js" type="text/javascript"></script>
    </body>
</html>
