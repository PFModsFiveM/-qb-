<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
        <title>QBCore Scoreboard</title>
    </head>
    <body>
        <div class="container">
            <div class="scoreboard-block">
                <div class="scoreboard-header">
                    <p>Server Info</p>
                    <div class="players-pill" id="players-pill"></div>
                </div>
                <div class="players-bar"><div class="players-bar-fill" id="players-bar-fill"></div></div>
                <div class="scoreboard-info"></div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
