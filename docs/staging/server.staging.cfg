# PF staging - local only. Mirrors the live server.cfg start order with the duplicate resources removed:
#   one ambulance job: pf-ambulancejob ([pfscripts], with the hardening); pfm-ambulancejob was removed from [qb]
#   no pfm-cityhall (pf-government civil services serve those events)
#   no pf-governmentwebsiteonly (old copy of pf-government)
#   no [jobsystem] / [custom] copies
#   no pfm-mechanicjob / pfm-scoreboard (removed from [qb]: pf-mechanicjob and pf-scoreboard are the ones in use)
#   pfm-hud still runs beside pf-hud; it leaves stress to pf-hud while pf-hud is started
# Not started here: "guard" (no such resource on disk), map packs ([roxwood] ...), [scripts] (map/dev tools).
# Live differences on purpose: local endpoint, LAN only, 4 slots, throwaway database, no secrets in this file.

endpoint_add_tcp "127.0.0.1:30151"
endpoint_add_udp "127.0.0.1:30151"
sv_maxclients 4
sv_lan 1
sv_master1 ""
sv_hostname "PF staging (no duplicates, local)"
sets sv_projectName "PF staging"
sets sv_projectDesc "Local staging run"
sets tags "staging"
sets locale "root-AQ"
sv_enforceGameBuild 3095
sv_scriptHookAllowed 1
set resources_useSystemChat true
set onesync on

setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1

set mysql_connection_string "mysql://root@127.0.0.1:3399/pf_staging"
exec secret_key.cfg

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# same order as the live server.cfg (pfm-core before [standalone]/[voice]: illenium-appearance and
# qb-radio call exports['pfm-core'] when they load)
ensure oxmysql
ensure pfm-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure ox_lib
ensure [pfscripts]

add_ace group.admin command allow
add_ace group.admin pf.mechanic.admincustoms allow
add_ace group.admin guidebook.admin allow
add_ace group.admin mapcal.admin allow
add_ace resource.pfm-core command allow
add_ace qbcore.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
